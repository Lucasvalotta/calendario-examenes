<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario de exámenes</title>
<style>
  :root {
    --bg: #fdf8f3; --card: #ffffff; --ink: #2b2433; --muted: #8a8094;
    --line: #ece4dc; --accent: #c2477a; --accent-soft: #f9e3ec; --today: #ffd98a;
    --Parcial: #c2477a; --Final: #7a3fc2; --Recuperatorio: #d9822b;
    --Entrega: #2b8fa6; --Otro: #6b7a5a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 14px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 1.6rem; }
  h1 span { color: var(--accent); }
  .btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
         padding: 10px 16px; border-radius: 999px; font-weight: 600; border: 0; cursor: pointer; font-size: 0.95rem; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .nav { display: flex; align-items: center; gap: 10px; margin: 22px 0 12px; }
  .nav h2 { margin: 0; font-size: 1.25rem; min-width: 190px; text-transform: capitalize; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--card);
          border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .dow { padding: 8px 6px; font-size: 0.75rem; font-weight: 700; color: var(--muted);
         text-transform: uppercase; border-bottom: 1px solid var(--line); text-align: center; }
  .day { min-height: 96px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .day:nth-child(7n) { border-right: 0; }
  .day.out { background: #faf6f2; color: #c9bfb5; }
  .num { font-size: 0.8rem; font-weight: 600; display: inline-block; width: 24px; height: 24px;
         line-height: 24px; text-align: center; border-radius: 50%; }
  .day.today .num { background: var(--today); color: var(--ink); }
  .ev { display: block; margin-top: 4px; padding: 3px 6px; border-radius: 6px; font-size: 0.72rem;
        color: #fff; background: var(--c, var(--accent)); cursor: pointer; overflow: hidden;
        white-space: nowrap; text-overflow: ellipsis; border: 0; width: 100%; text-align: left; font-family: inherit; }
  .status { color: var(--muted); font-size: 0.9rem; margin: 8px 0; }
  .upcoming { margin-top: 28px; }
  .upcoming h3 { margin: 0 0 10px; }
  .item { display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line);
          border-left: 5px solid var(--c, var(--accent)); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; }
  .item .date { font-weight: 700; min-width: 64px; text-align: center; }
  .item .date small { display: block; font-weight: 500; color: var(--muted); font-size: 0.75rem; }
  .item .info { flex: 1; }
  .item .info b { display: block; }
  .item .info span { color: var(--muted); font-size: 0.85rem; }
  .left { font-size: 0.8rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
  dialog { border: 0; border-radius: 16px; padding: 22px; max-width: 420px; width: 92%; }
  dialog::backdrop { background: rgba(30, 20, 40, 0.4); }
  dialog h3 { margin: 0 0 4px; }
  dialog p { margin: 6px 0; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; color: #fff; font-size: 0.75rem;
         background: var(--c, var(--accent)); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  @media (max-width: 640px) {
    .day { min-height: 62px; padding: 3px; }
    .ev { font-size: 0; height: 8px; padding: 0; border-radius: 4px; }
    .dow { font-size: 0.65rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📅 Mis <span>exámenes</span></h1>
    <a class="btn" id="add" target="_blank" rel="noopener">＋ Anotar examen</a>
  </header>

  <div class="nav">
    <button class="btn ghost" id="prev" aria-label="Mes anterior">‹</button>
    <h2 id="month"></h2>
    <button class="btn ghost" id="next" aria-label="Mes siguiente">›</button>
    <button class="btn ghost" id="todayBtn">Hoy</button>
  </div>
  <div class="status" id="status">Cargando exámenes…</div>
  <div class="grid" id="grid"></div>

  <section class="upcoming">
    <h3>Próximos exámenes</h3>
    <div id="list"></div>
  </section>
</div>

<dialog id="dlg">
  <div id="dlgBody"></div>
  <div class="actions">
    <a class="btn ghost" id="dlgEdit" target="_blank" rel="noopener">Editar / borrar</a>
    <button class="btn" onclick="document.getElementById('dlg').close()">Cerrar</button>
  </div>
</dialog>

<script>
// Si la página se abre desde GitHub Pages, el usuario y el repo se detectan solos.
const FALLBACK_OWNER = "Lucasvalotta";
const FALLBACK_REPO = "calendario-examenes";

function detectRepo() {
  const host = location.hostname;
  if (host.endsWith(".github.io")) {
    const owner = host.replace(".github.io", "");
    const repo = location.pathname.split("/").filter(Boolean)[0] || FALLBACK_REPO;
    return { owner, repo };
  }
  return { owner: FALLBACK_OWNER, repo: FALLBACK_REPO };
}
const { owner: OWNER, repo: REPO } = detectRepo();
const REPO_URL = `https://github.com/${OWNER}/${REPO}`;
document.getElementById("add").href = `${REPO_URL}/issues/new?template=examen.yml`;

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const COLORS = { Parcial: "var(--Parcial)", Final: "var(--Final)", Recuperatorio: "var(--Recuperatorio)",
                 "Entrega / TP": "var(--Entrega)", Otro: "var(--Otro)" };

let exams = [];
let view = new Date(); view.setDate(1);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function key(d) { return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }

// Lee el cuerpo de un issue creado con el formulario ("### Campo\n\nvalor")
function parseBody(body) {
  const out = {};
  const parts = (body || "").split(/^###\s+/m).slice(1);
  for (const p of parts) {
    const [title, ...rest] = p.split("\n");
    let val = rest.join("\n").trim();
    if (val === "_No response_") val = "";
    out[title.trim().toLowerCase()] = val;
  }
  return out;
}
function parseDate(s) {
  if (!s) return null;
  s = s.trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    let y = +m[3]; if (y < 100) y += 2000;
    return new Date(y, +m[2] - 1, +m[1]);
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}

async function load() {
  const status = document.getElementById("status");
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/issues?labels=examen&state=open&per_page=100`,
                            { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error(res.status);
    const issues = await res.json();
    exams = issues.map(i => {
      const f = parseBody(i.body);
      const date = parseDate(f["fecha"]);
      const materia = f["materia"] || i.title.replace(/^Examen:\s*/i, "");
      return { date, materia, hora: f["hora"], tipo: f["tipo"] || "Otro", lugar: f["aula / lugar"],
               notas: f["notas"], url: i.html_url, rawFecha: f["fecha"] };
    });
    const bad = exams.filter(e => !e.date);
    exams = exams.filter(e => e.date).sort((a, b) => a.date - b.date);
    status.textContent = bad.length
      ? `⚠️ ${bad.length} examen(es) con fecha mal escrita (usá DD/MM/AAAA): ${bad.map(b => b.materia).join(", ")}`
      : "";
  } catch (e) {
    status.textContent = "No se pudieron cargar los exámenes. Probá recargar la página en un ratito.";
  }
  render();
}

function render() {
  document.getElementById("month").textContent = `${MESES[view.getMonth()]} ${view.getFullYear()}`;
  const grid = document.getElementById("grid");
  grid.innerHTML = DIAS.map(d => `<div class="dow">${d}</div>`).join("");

  const byDay = {};
  exams.forEach((e, i) => { (byDay[key(e.date)] ||= []).push(i); });

  const start = new Date(view);
  const offset = (start.getDay() + 6) % 7; // lunes primero
  start.setDate(start.getDate() - offset);
  const todayKey = key(new Date());

  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i >= 35 && d.getMonth() !== view.getMonth()) break;
    const cls = ["day"];
    if (d.getMonth() !== view.getMonth()) cls.push("out");
    if (key(d) === todayKey) cls.push("today");
    const evs = (byDay[key(d)] || []).map(idx => {
      const e = exams[idx];
      return `<button class="ev" style="--c:${COLORS[e.tipo] || COLORS.Otro}" onclick="show(${idx})"
                title="${esc(e.materia)}">${e.hora ? esc(e.hora) + " " : ""}${esc(e.materia)}</button>`;
    }).join("");
    grid.insertAdjacentHTML("beforeend", `<div class="${cls.join(" ")}"><span class="num">${d.getDate()}</span>${evs}</div>`);
  }

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const next = exams.map((e, i) => [e, i]).filter(([e]) => e.date >= today);
  document.getElementById("list").innerHTML = next.length ? next.map(([e, i]) => {
    const days = Math.round((e.date - today) / 86400000);
    const left = days === 0 ? "¡Hoy!" : days === 1 ? "Mañana" : `Faltan ${days} días`;
    return `<div class="item" style="--c:${COLORS[e.tipo] || COLORS.Otro}" onclick="show(${i})">
      <div class="date">${e.date.getDate()}<small>${MESES[e.date.getMonth()].slice(0, 3)}</small></div>
      <div class="info"><b>${esc(e.materia)}</b>
        <span>${esc(e.tipo)}${e.hora ? " · " + esc(e.hora) : ""}${e.lugar ? " · " + esc(e.lugar) : ""}</span></div>
      <div class="left">${left}</div></div>`;
  }).join("") : `<p class="status">No hay exámenes anotados. ¡Tocá "＋ Anotar examen" para agregar uno!</p>`;
}

function show(i) {
  const e = exams[i];
  const fecha = e.date.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  document.getElementById("dlgBody").innerHTML = `
    <span class="tag" style="--c:${COLORS[e.tipo] || COLORS.Otro}">${esc(e.tipo)}</span>
    <h3 style="margin-top:8px">${esc(e.materia)}</h3>
    <p>📅 ${esc(fecha)}${e.hora ? " · 🕒 " + esc(e.hora) : ""}</p>
    ${e.lugar ? `<p>📍 ${esc(e.lugar)}</p>` : ""}
    ${e.notas ? `<p style="white-space:pre-wrap">📝 ${esc(e.notas)}</p>` : ""}`;
  document.getElementById("dlgEdit").href = e.url;
  document.getElementById("dlg").showModal();
}

document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
document.getElementById("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
document.getElementById("todayBtn").onclick = () => { view = new Date(); view.setDate(1); render(); };
load();
</script>
</body>
</html>
