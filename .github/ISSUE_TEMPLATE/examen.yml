name: 📚 Nuevo examen
description: Anotá un examen en el calendario
title: "Examen: "
labels: ["examen"]
body:
  - type: input
    id: materia
    attributes:
      label: Materia
      placeholder: "Ej: Análisis Matemático II"
    validations:
      required: true
  - type: input
    id: fecha
    attributes:
      label: Fecha
      description: Formato DD/MM/AAAA
      placeholder: "Ej: 15/12/2026"
    validations:
      required: true
  - type: input
    id: hora
    attributes:
      label: Hora
      placeholder: "Ej: 18:30"
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - Parcial
        - Recuperatorio
        - Final
        - Entrega / TP
        - Otro
  - type: input
    id: lugar
    attributes:
      label: Aula / Lugar
      placeholder: "Ej: Aula 204, Sede Centro"
  - type: textarea
    id: notas
    attributes:
      label: Notas
      placeholder: "Temas, qué llevar, etc."
